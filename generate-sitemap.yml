name: Generar Sitemap Dinámico

on:
  schedule:
    - cron: "0 6 * * *"  # Todos los días a las 6am UTC
  workflow_dispatch:       # También se puede lanzar manualmente

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Generar sitemap.xml
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
        run: node generate-sitemap.js

      - name: Commit y push del sitemap actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "chore: actualizar sitemap.xml [$(date +'%Y-%m-%d')]"
          git push
